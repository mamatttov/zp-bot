services:
  bot:
    build: .
    # Токен и настройки берутся из файла .env рядом, в образ они не попадают.
    env_file: .env
    # База хранится в папке data на компьютере и переживает перезапуск контейнера.
    volumes:
      - ./data:/app/data
    # Если бот упал или сервер перезагрузился, Docker поднимет его снова.
    restart: unless-stopped